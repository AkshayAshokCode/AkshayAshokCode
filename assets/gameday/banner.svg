<svg width="840" height="250" viewBox="0 0 840 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gdTitle gdDesc">
  <title id="gdTitle">GameDay: currently building</title>
  <desc id="gdDesc">GameDay organises your weekly game, so the group chat can go back to banter. Web, Android and iOS. 3 platforms, 50+ merged pull requests, 30+ API operations, 21 database migrations.</desc>
  <defs>
    <radialGradient id="beam" cx="0.14" cy="0" r="0.75" gradientTransform="scale(1 3.36)">
      <stop offset="0" stop-color="#e8ff47" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#e8ff47" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e8ff47" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconBeam" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#e8ff47" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#e8ff47" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e8ff47" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="840" height="250" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Space Grotesk', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: #e8ff47; }
    .title { font-size: 34px; font-weight: 700; fill: #f2f5ee; letter-spacing: -0.5px; }
    .line { font-size: 15px; fill: #c9d1c4; }
    .sub { font-size: 13px; fill: #8f998c; }
    .chip { font-size: 11.5px; font-weight: 600; fill: #f2f5ee; }
    .num { font-size: 28px; font-weight: 700; fill: #e8ff47; }
    .nl { font-size: 12px; fill: #8f998c; }
    .stack { font-size: 11px; fill: #8f998c; }
    .beam { animation: flood 5s ease-in-out infinite; }
    .live { animation: pulse 2s ease-in-out infinite; }
    .fade { animation: fadeIn 0.7s ease-out backwards; }
    @keyframes flood { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="250" fill="#0a0e0b"/>
    <rect width="840" height="250" fill="url(#beam)" class="beam"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="249" rx="12" stroke="#2a3528"/>

  <!-- Brand mark (from the GameDay icon) -->
  <g transform="translate(36,40) scale(0.15625)">
    <rect width="512" height="512" rx="112" fill="#0a0e0b" stroke="#2a3528" stroke-width="6"/>
    <rect width="512" height="512" rx="112" fill="url(#iconBeam)"/>
    <circle cx="256" cy="276" r="150" fill="#e8ff47"/>
    <polygon points="256,214 315,257 292.5,326 219.5,326 197,257" fill="#0a0e0b"/>
  </g>

  <g class="fade">
    <text x="132" y="56" class="label mono">CURRENTLY BUILDING</text>
    <text x="130" y="92" class="title">GameDay</text>
  </g>
  <g class="fade" style="animation-delay:0.15s">
    <text x="36" y="136" class="line">Organises your weekly game, so the group chat can go back to banter.</text>
    <text x="36" y="158" class="sub">Who’s in, which day, fair teams and who has paid, all from one link in the group chat.</text>
  </g>

  <!-- Platform chips -->
  <g class="fade" style="animation-delay:0.1s">
    <rect x="530" y="40" width="80" height="26" rx="13" fill="#111712" stroke="#2a3528"/>
    <circle cx="546" cy="53" r="4" fill="#e8ff47" class="live"/>
    <text x="556" y="57" class="chip">Web</text>
    <rect x="618" y="40" width="98" height="26" rx="13" fill="#111712" stroke="#2a3528"/>
    <circle cx="634" cy="53" r="4" fill="#e8ff47" class="live" style="animation-delay:0.4s"/>
    <text x="644" y="57" class="chip">Android</text>
    <rect x="724" y="40" width="80" height="26" rx="13" fill="#111712" stroke="#2a3528"/>
    <circle cx="740" cy="53" r="4" fill="none" stroke="#8f998c" stroke-width="1.5"/>
    <text x="750" y="57" class="chip" style="fill:#c9d1c4">iOS</text>
    <text x="804" y="84" text-anchor="end" class="stack mono">● live   ○ coming to the App Store</text>
  </g>

  <line x1="36" y1="180" x2="804" y2="180" stroke="#1d261f"/>

  <!-- Numbers -->
  <g class="fade" style="animation-delay:0.3s">
    <text x="36" y="218" class="num">3</text><text x="36" y="236" class="nl">platforms</text>
    <text x="156" y="218" class="num">50+</text><text x="156" y="236" class="nl">merged PRs</text>
    <text x="286" y="218" class="num">30+</text><text x="286" y="236" class="nl">API operations</text>
    <text x="426" y="218" class="num">21</text><text x="426" y="236" class="nl">DB migrations</text>
  </g>
  <g class="fade" style="animation-delay:0.45s">
    <text x="804" y="212" text-anchor="end" class="stack mono">Next.js · Kotlin · Compose · SwiftUI</text>
    <text x="804" y="230" text-anchor="end" class="stack mono">Supabase · Postgres · Firebase</text>
  </g>
</svg>
